<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <title>Test Calcolatrice API - Control Panel</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; padding: 20px; background: #f0f2f5; color: #333; }
        h1 { text-align: center; margin-bottom: 30px; color: #1a1a1a; }
        
        .container { display: flex; gap: 25px; flex-wrap: wrap; justify-content: center; max-width: 1200px; margin: 0 auto; }

        .panel {
            flex: 1;
            min-width: 350px;
            max-width: 500px;
            background: white;
            border-radius: 12px;
            padding: 25px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
            display: flex;
            flex-direction: column;
        }

        .panel h2 {
            margin-bottom: 20px;
            padding-bottom: 10px;
            border-bottom: 3px solid;
            font-size: 1.5em;
        }

        .v1 h2 { border-color: #6c757d; color: #495057; }
        .v2 h2 { border-color: #007bff; color: #0056b3; }

        .form-group { margin-bottom: 15px; }
        label { display: block; margin-bottom: 6px; font-weight: 600; font-size: 0.9em; color: #666; }
        input, select { 
            width: 100%; 
            padding: 10px; 
            border: 1px solid #ddd; 
            border-radius: 6px; 
            font-size: 1em;
            transition: border-color 0.2s;
        }
        input:focus { border-color: #007bff; outline: none; }

        .buttons { margin-top: 20px; display: flex; gap: 12px; }
        button {
            flex: 1; padding: 12px; border: none;
            border-radius: 6px; cursor: pointer;
            font-size: 1em; font-weight: bold; color: white;
            transition: transform 0.1s, opacity 0.2s;
        }
        .v1 .btn-post { background: #5a6268; }
        .v1 .btn-get  { background: #868e96; }
        .v2 .btn-post { background: #007bff; }
        .v2 .btn-get  { background: #4dabf7; }
        button:hover { opacity: 0.9; transform: translateY(-1px); }
        button:active { transform: translateY(0); }

        .risultato {
            margin-top: 20px; padding: 15px;
            background: #f8f9fa; border-radius: 8px;
            border-left: 5px solid #dee2e6;
            font-size: 0.95em; min-height: 80px;
            word-break: break-all;
        }
        .risultato.successo { border-color: #28a745; background: #eef9f1; }
        .risultato.errore   { border-color: #dc3545; background: #fff5f5; }
        
        pre { 
            margin-top: 12px; 
            font-family: 'Consolas', monospace;
            font-size: 0.85em; 
            background: #272822; 
            color: #f8f8f2;
            padding: 10px;
            border-radius: 4px;
            overflow-x: auto;
        }
        .meta { font-size: 0.8em; color: #6c757d; margin-top: 8px; font-style: italic; }
        #op2-container-v2 { transition: all 0.3s ease; }
    </style>
</head>
<body>

    <h1>🧮 Calcolatrice REST API - Pannello di Test</h1>

    <div class="container">

        <div class="panel v1">
            <h2>Versione 1 (Base)</h2>
            <div class="form-group">
                <label>Operando 1</label>
                <input type="number" id="v1-op1" value="10">
            </div>
            <div class="form-group">
                <label>Operatore</label>
                <select id="v1-operatore">
                    <option value="SOMMA">SOMMA (+)</option>
                    <option value="SOTTRAZIONE">SOTTRAZIONE (-)</option>
                    <option value="MOLTIPLICAZIONE">MOLTIPLICAZIONE (*)</option>
                    <option value="DIVISIONE">DIVISIONE (/)</option>
                </select>
            </div>
            <div class="form-group">
                <label>Operando 2</label>
                <input type="number" id="v1-op2" value="5">
            </div>

            <div class="buttons">
                <button class="btn-post" onclick="eseguiChiamata('v1', 'POST')">Invia POST</button>
                <button class="btn-get"  onclick="eseguiChiamata('v1', 'GET')">Invia GET</button>
            </div>

            <div class="risultato" id="v1-risultato">In attesa di input...</div>
        </div>

        <div class="panel v2">
            <h2>Versione 2 (Advanced)</h2>
            <div class="form-group">
                <label>Operando 1</label>
                <input type="number" id="v2-op1" value="16">
            </div>
            <div class="form-group">
                <label>Operatore</label>
                <select id="v2-operatore" onchange="toggleOp2V2()">
                    <option value="+">Addizione (+)</option>
                    <option value="-">Sottrazione (-)</option>
                    <option value="*">Moltiplicazione (*)</option>
                    <option value="/">Divisione (/)</option>
                    <option value="^">Potenza (^)</option>
                    <option value="%">Modulo (%)</option>
                    <option value="sqrt">Radice Quadrata (√)</option>
                </select>
            </div>
            <div class="form-group" id="op2-container-v2">
                <label>Operando 2</label>
                <input type="number" id="v2-op2" value="2">
            </div>

            <div class="buttons">
                <button class="btn-post" onclick="eseguiChiamata('v2', 'POST')">Invia POST</button>
                <button class="btn-get"  onclick="eseguiChiamata('v2', 'GET')">Invia GET</button>
            </div>

            <div class="risultato" id="v2-risultato">In attesa di input...</div>
        </div>

    </div>

    <script>
        // Gestisce la visibilità dell'operando 2 nella V2 (non serve per la radice quadrata)
        function toggleOp2V2() {
            const op = document.getElementById('v2-operatore').value;
            const container = document.getElementById('op2-container-v2');
            if (op === 'sqrt') {
                container.style.opacity = '0.2';
                container.style.pointerEvents = 'none';
            } else {
                container.style.opacity = '1';
                container.style.pointerEvents = 'auto';
            }
        }

        async function eseguiChiamata(versione, metodo) {
            const op1 = document.getElementById(`${versione}-op1`).value;
            const op2 = document.getElementById(`${versione}-op2`).value;
            const operatore = document.getElementById(`${versione}-operatore`).value;
            const box = document.getElementById(`${versione}-risultato`);
            
            box.className = 'risultato';
            box.innerHTML = '<em>Chiamata in corso...</em>';

            try {
                let url = `/api/${versione}/calcola/${metodo.toLowerCase()}`;
                let options = { method: metodo };

                if (metodo === 'POST') {
                    options.headers = { 'Content-Type': 'application/json' };
                    options.body = JSON.stringify({
                        operando1: parseFloat(op1),
                        operando2: parseFloat(op2),
                        operatore: operatore
                    });
                } else {
                    // Costruzione Query String per GET
                    let params = new URLSearchParams();
                    params.append('operando1', op1);
                    params.append('operatore', operatore);
                    // Aggiungi op2 solo se necessario o se presente
                    if (versione === 'v1' || operatore !== 'sqrt') {
                        params.append('operando2', op2);
                    }
                    url += `?${params.toString()}`;
                }

                const response = await fetch(url, options);
                const data = await response.json();

                // Recupero Header personalizzati
                const apiVer = response.headers.get('X-API-Version');
                const reqId = response.headers.get('X-Request-ID');

                stampaRisposta(versione, data, response.ok, apiVer, reqId);

            } catch (error) {
                box.className = 'risultato errore';
                box.innerHTML = `<strong>❌ Errore critico:</strong> ${error.message}`;
            }
        }

        function stampaRisposta(versione, data, isOk, apiVer, reqId) {
            const box = document.getElementById(`${versione}-risultato`);
            
            if (!isOk || data.errore) {
                box.className = 'risultato errore';
                box.innerHTML = `<strong>❌ Errore (${data.status || 'HTTP'}):</strong> ${data.errore || 'Errore sconosciuto'}`;
            } else {
                box.className = 'risultato successo';
                let html = `<strong>✅ Risultato: ${data.operazione}</strong>`;
                
                // Info extra per V2
                let metaInfo = `API: ${apiVer || data.versione_api || '1.0'}`;
                if (reqId || data.request_id) metaInfo += ` | ID: ${reqId || data.request_id}`;
                if (data.timestamp) metaInfo += ` | ${data.timestamp}`;
                
                html += `<div class="meta">${metaInfo}</div>`;
                html += `<pre>${JSON.stringify(data, null, 2)}</pre>`;
                box.innerHTML = html;
            }
        }
    </script>
</body>
</html>
